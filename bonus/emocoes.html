<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Roda das emoções</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>
<body class="highcharts-light">
    <div id="container" style="height: 95vh;"></div>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/sunburst.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <script>
    var emocoes = [{
        id: 'Medo',
        colors: ['#00A3B9', '#12BCCA', '#04c3d4'],
        children: {
            'Apreensão': ['Desamparo', 'Amedrontamento'],
            'Ansiedade': ['Sobrecarga', 'Preocupação'],
            'Insegurança': ['Inadequação', 'Inferioridade'],
            'Fraqueza': ['Desvalorização', 'Insignificância'],
            'Rejeição': ['Exclusão', 'Perseguição'],
            'Ameaça': ['Nervosismo', 'Exposição'],
        },
    },{
        id: 'Raiva',
        colors: ['#7572B4', '#8C8CC4', '#7B7FBA'],
        children: {
            'Decepção': ['Traição', 'Ressentimento'],
            'Humilhação': ['Desrespeito', 'Ridicularização'],
            'Amargura': ['Indignação', 'Violação'],
            'Ira': ['Fúria', 'Ciúme'],
            'Agressividade': ['Provocação', 'Hostilidade'],
            'Frustração': ['Furor', 'Irritação'],
            'Distanciamento': ['Isolamento', 'Insensibilidade'],
            'Criticismo': ['Ceticismo', 'Desdém'],
        },
    },{
        id: 'Nojo',
        colors: ['#AB7BB5', '#BC95C3', '#cc99c2'],
        children: {
            'Desaprovação': ['Julgamento', 'Constrangimento'],
            'Decepção': ['Repugnância', 'Revolta'],
            'Repulsa': ['Náusea', 'Aversão'],
            'Afastamento': ['Horror', 'Hesitação'],
        },
    },{
        id: 'Tristeza',
        colors: ['#CE7C87', '#E297A5', '#c28a94'],
        children: {
            'Mágoa': ['Constrangimento', 'Decepção'],
            'Depressão': ['Inferioridade', 'Vazio'],
            'Culpa': ['Remorso', 'Vergonha'],
            'Desespero': ['Impotência', 'Luto'],
            'Vulnerabilidade': ['Fragilidade', 'Vitimizacão'],
            'Solidão': ['Abandono', 'Isolamento'],
        },
    },{
        id: 'Alegria',
        colors: ['#E1876E', '#EF9783', '#e39d8d'],
        children: {
            'Otimismo': ['Inspiração', 'Esperança'],
            'Confiança': ['Intimidade', 'Sensibilidade'],
            'Paz': ['Gratidão', 'Amor'],
            'Poder': ['Criatividade', 'Coragem'],
            'Aceitação': ['Valorização', 'Respeito'],
            'Orgulho': ['Autoconfiança', 'Sucesso'],
            'Interesse': ['Inquisitividade', 'Curiosidade'],
            'Contentamento': ['Alegria', 'Liberdade'],
            'Diversão': ['Travessura', 'Excitação'],
        },
    },{
        id: 'Surpresa',
        colors: ['#E5A44B', '#ECB45D', '#d6ac69'],
        children: {
            'Entusiasmo': ['Energia', 'Empolgação'],
            'Admiração': ['Deslumbre', 'Perplexidade'],
            'Confusão': ['Perplexidade', 'Desilusão'],
            'Sobressalto': ['Consternação', 'Choque'],
        },
    },{
        id: 'Mal',
        colors: ['#35BA9F', '#5CC2AF', '#70b8aa'],
        children: {
            'Cansaço': ['Falta de foco', 'Sonolência'],
            'Estresse': ['Descontrole', 'Sobrecarga'],
            'Pressão': ['Pressa', 'Tensão'],
            'Tédio': ['Apatia', 'Indiferença'],
        },
    }];
    var data = [];
    emocoes.forEach(emocao => {
        data.push({
            id: emocao.id,
            name: emocao.id,
            color: emocao.colors[0],
            parent: '',
        });
        for(let inner in emocao.children) {
            data.push({
                id: emocao.id + inner,
                name: inner,
                color: emocao.colors[1],
                parent: emocao.id,
            });
            emocao.children[inner].forEach(outer => {
                data.push({
                    id: emocao.id + inner + outer,
                    name: outer,
                    color: emocao.colors[2],
                    parent: emocao.id + inner,
                    value: 1
                });
            });
        }
    });
    Highcharts.chart('container', {
        title: { text: 'Roda das Emoções' },
        subtitle: { enabled: false },
        series: [{
            type: 'sunburst',
            name: 'Emoções',
            data: data,
            allowDrillToNode: true,
            cursor: 'pointer',
            borderWidth: 0,
            dataLabels: {
                format: '{point.name}',
                rotationMode: 'circular',
                style: {
                    fontSize: '13px',
                    fontWeight: 400,
                    textOutline: 0,
                },
                color: '#FFF',
            },
            levels: [{
                level: 1,
                dataLabels: {
                    rotationMode: 'perpendicular'
                },
                levelSize: {
                    unit: 'percentage',
                    value: 25,
                },
            },{
                level: 2,
                levelSize: {
                    unit: 'percentage',
                    value: 35,
                },
            },{
                level: 3,
                levelSize: {
                    unit: 'percentage',
                    value: 40,
                },
            }]

        }],
        credits: { enabled: false },
        tooltip: {
            headerFormat: '',
            pointFormat: '<b>{point.name}</b>'
        }
    });
    </script>
</body>
</html>
